name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake build configuration"
        type: choice
        options:
          - Release
          - RelWithDebInfo
        default: Release

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Cemu-Latte-AX
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Free Runner Disk Space (~25 GB Reclaimed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build pkg-config curl zip unzip tar \
            freeglut3-dev libgcrypt20-dev libglm-dev libgtk-3-dev libpulse-dev \
            libsecret-1-dev libsystemd-dev libudev-dev nasm libbluetooth-dev \
            libwayland-dev wayland-protocols libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Bootstrap vcpkg
        run: bash ./dependencies/vcpkg/bootstrap-vcpkg.sh

      - name: Configure & Build Cemu Latte [AX] (Linux, Clang)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_AX_SDK=ON \
            -DENABLE_VCPKG=ON
          cmake --build build --parallel
          mv bin/Cemu_release bin/Cemu || true

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cemu-latte-ax-linux-x86_64
          path: bin/Cemu
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Cemu-Latte-AX
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Configure & Build Cemu Latte [AX] (Windows, clang-cl)
        shell: pwsh
        run: |
          $env:CXXFLAGS="-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH=1"
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} `
            -DENABLE_AX_SDK=ON `
            -DENABLE_VCPKG=ON `
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build" `
            "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/INCREMENTAL:NO"
          cmake --build build --config ${{ inputs.build_type }} --parallel
          if (Test-Path bin/Cemu_release.exe) { Move-Item -Force bin/Cemu_release.exe bin/Cemu.exe }

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cemu-latte-ax-windows-x86_64
          path: bin/Cemu.exe
          retention-days: 14
